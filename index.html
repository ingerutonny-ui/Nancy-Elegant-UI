<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nancy Elegant UI - Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Regla Nancy Elegant: Escalado y Tipografía */
        body { 
            zoom: 1.3; 
            font-family: 'Inter', ui-sans-serif, system-ui; 
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body class="bg-[#FBFBFE] flex items-center justify-center min-h-screen">
    <div class="text-center p-12 bg-white shadow-sm border border-slate-100 rounded-3xl">
        <h1 class="text-4xl font-extralight tracking-[0.15em] text-slate-900 uppercase">
            Nancy <span class="font-semibold text-indigo-600">Elegant</span>
        </h1>
        <div class="h-[1px] w-12 bg-indigo-200 mx-auto my-6"></div>
        <p class="text-slate-400 font-light tracking-wide italic">Infraestructura lista para monetizar.</p>

</html>
